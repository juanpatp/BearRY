<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro facial</title>
    <link rel="stylesheet" href="css/appF.css">

    <!-- Los modulos de three.js (exportadores, etc.) importan "three" -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <video id="video-renderer"></video>
        <canvas id="canvas-renderer"></canvas>
    </div>

    <script type="module">
        import { startFaceFilter } from "./js/mediapipe/mediapipe_controller.js";

        // Escena exportada desde el editor de three.js. Por defecto app.json;
        // para probar otra sin tocar el codigo: index.html?json=app_hulk.json
        const scene = new URLSearchParams(location.search).get("json") || "appF.json";

        startFaceFilter(scene);
    </script>
</body>

</html>
